name: Deploy to Oracle VM

on:
  push:
    branches: [master]

# İki deploy aynı anda çalışmasın: art arda push yapıldığında ikisi birden
# "docker compose up" çalıştırıp container adı çakışmasıyla başarısız
# olmuştu. Sıraya alıyoruz, çalışan iptal edilmiyor — yarıda kesilmiş bir
# deploy, tamamlanmış eskisinden kötü.
concurrency:
  group: deploy-oracle-vm
  cancel-in-progress: false

# Test işleri depoyu okuyor, deploy işi yalnızca SSH; jetona en dar yetki.
permissions:
  contents: read

jobs:
  # TEST KAPISI: deploy ancak iki test işi de geçerse başlıyor. Önceden push
  # doğrudan canlıya gidiyordu; "bütün uçlar 500" türünden hatalar (6 Eylül)
  # ancak canlıda görülüyordu (güvenlik incelemesi, 25 Eylül). Action'lar
  # deploy adımı gibi commit SHA'sına sabit.
  backend-test:
    runs-on: ubuntu-latest
    # Gerçek PostgreSQL: DealsQueryService'in hataları SQL'e çevirme
    # aşamasında çıkıyor (bu sınıf canlıyı iki kez düşürdü), bellek içi test
    # onları göremez. initdb ayarları canlıyla aynı (builtin / C.UTF-8):
    # farklı collation metin sıralamasını sessizce değiştirir.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: indirim_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB: Host=localhost;Port=5432;Database=indirim_test;Username=postgres;Password=test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Test PROJESİNİN yolu veriliyor: çözüm dosyası (.slnx) verilince
      # dotnet test hiç test çalıştırmadan "başarılı" dönüyor (ölçüldü) ve
      # kapı sahte güven verirdi.
      - run: dotnet test backend/tests/IndirimTakip.Infrastructure.Tests/IndirimTakip.Infrastructure.Tests.csproj

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  # Bölünen büyük dosyalar yeniden büyümesin (güvenlik incelemesi B5, 26 Eylül).
  # Sınır ve dondurulmuş tavanlar betiğin içinde.
  boyut-siniri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/boyut-siniri.sh

  deploy:
    needs: [backend-test, frontend-test, boyut-siniri]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # Etiket değil COMMIT SHA'sı: etiket sonradan başka koda taşınabilir
        # (tj-actions olayı) ve bu adım üretim SSH anahtarını görüyor.
        # SHA = v1.0.3, `git ls-remote https://github.com/appleboy/ssh-action refs/tags/v1.0.3`.
        # Sunucu anahtarı parmak izi (fingerprint) BİLEREK eklenmedi: sunucu üç
        # anahtar türü sunuyor, action'ın hangisini seçeceği belirsiz; yanlış tür
        # bütün deploy'ları düşürür (güvenlik incelemesi, 25 Eylül).
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          # Bu anahtar sunucuda YALNIZCA deploy kapısını çalıştırabiliyor
          # (authorized_keys: restrict,command="/usr/local/bin/deploy-kapisi tr").
          # Kapı "deploy" dışındaki her komutu reddediyor; depoyu güncelleyip
          # scripts/deploy.sh'ı çalıştırıyor — adımlar orada (27 Eylül'e kadar
          # burada yazılıydı). Gerekçe: scripts/deploy-kapisi.sh.
          script: deploy

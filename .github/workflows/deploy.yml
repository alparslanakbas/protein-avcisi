name: Deploy to Oracle VM

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/protein-avcisi
            git pull
            docker compose build
            docker compose up -d
            # Caddyfile bind-mount olduğu için "up -d" onu yeniden yüklemiyor:
            # dosya değişse bile container'ın tanımı değişmediğinden Docker
            # yeniden oluşturmuyor ve Caddy bellekteki eski yapılandırmayla
            # devam ediyor. Kesintisiz yeniden yükleme bunu kapatıyor.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

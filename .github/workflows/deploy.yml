name: Deploy to Oracle VM

on:
  push:
    branches: [master]

# İki deploy aynı anda çalışmasın: art arda push yapıldığında ikisi birden
# "docker compose up" çalıştırıp container adı çakışmasıyla başarısız
# olmuştu. Sıraya alıyoruz, çalışan iptal edilmiyor — yarıda kesilmiş bir
# deploy, tamamlanmış eskisinden kötü.
concurrency:
  group: deploy-oracle-vm
  cancel-in-progress: false

# Test işleri depoyu okuyor, deploy işi yalnızca SSH; jetona en dar yetki.
permissions:
  contents: read

jobs:
  # TEST KAPISI: deploy ancak iki test işi de geçerse başlıyor. Önceden push
  # doğrudan canlıya gidiyordu; "bütün uçlar 500" türünden hatalar (6 Eylül)
  # ancak canlıda görülüyordu (güvenlik incelemesi, 25 Eylül). Action'lar
  # deploy adımı gibi commit SHA'sına sabit.
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      # Test PROJESİNİN yolu veriliyor: çözüm dosyası (.slnx) verilince
      # dotnet test hiç test çalıştırmadan "başarılı" dönüyor (ölçüldü) ve
      # kapı sahte güven verirdi.
      - run: dotnet test backend/tests/IndirimTakip.Infrastructure.Tests/IndirimTakip.Infrastructure.Tests.csproj

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false

  deploy:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # Etiket değil COMMIT SHA'sı: etiket sonradan başka koda taşınabilir
        # (tj-actions olayı) ve bu adım üretim SSH anahtarını görüyor.
        # SHA = v1.0.3, `git ls-remote https://github.com/appleboy/ssh-action refs/tags/v1.0.3`.
        # Sunucu anahtarı parmak izi (fingerprint) BİLEREK eklenmedi: sunucu üç
        # anahtar türü sunuyor, action'ın hangisini seçeceği belirsiz; yanlış tür
        # bütün deploy'ları düşürür (güvenlik incelemesi, 25 Eylül).
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/protein-avcisi

            # --ff-only: geçmiş ayrışmışsa sessizce merge commit üretmek
            # yerine yüksek sesle başarısız olsun.
            git pull --ff-only
            echo "Deploy edilen commit: $(git rev-parse --short HEAD)"

            docker compose build

            # --force-recreate ZORUNLU: "docker compose up -d" tek başına,
            # imaj yeniden derlenmiş olsa bile container'ı değiştirmeyebiliyor.
            # Bu gerçekten yaşandı — backend imajı derlendi, container
            # dokunulmadan kaldı ve canlı ESKİ kodu servis etmeye devam etti,
            # üstelik workflow "başarılı" göründü. Sessiz başarısızlık, açık
            # başarısızlıktan çok daha pahalı; birkaç saniyelik kesinti buna
            # değer.
            #
            # --no-deps: Caddy'ye dokunma. Onun yeniden oluşturulması TLS
            # bağlantılarını gereksiz yere koparırdı; yapılandırması zaten
            # aşağıda kesintisiz yeniden yükleniyor.
            docker compose up -d --force-recreate --no-deps backend frontend

            docker compose up -d caddy
            # Caddyfile dizin olarak bağlandığı için dosya güncel, ama Caddy
            # bellekteki yapılandırmayla çalışmaya devam ediyor; reload
            # kesintisiz devralmasını sağlıyor.
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile

            # Deploy'un GERÇEKTEN çalıştığını kanıtla. Bu adım olmadan
            # workflow, canlıda eski kod dururken bile yeşil görünüyordu.
            # Servislere Caddy container'ı üzerinden, compose ağının içinden
            # istek atıyoruz — dışarıdan bakınca Cloudflare önbelleği araya
            # girebilirdi.
            echo "Servislerin ayağa kalkması bekleniyor..."
            for i in $(seq 1 36); do
              # Frontend'e Host başlığı ŞART: Angular SSR'ın host koruması
              # (NG_ALLOWED_HOSTS) tanımadığı bir Host'a 400 dönüyor, yani
              # başlıksız prob sağlıklı bir sunucuyu bile hatalı gösterirdi.
              if docker compose exec -T caddy wget -q -O /dev/null --timeout=5 http://backend:8080/api/stats \
                 && docker compose exec -T caddy wget -q -O /dev/null --timeout=5 \
                    --header="Host: www.proteinavcisi.com.tr" http://frontend:4000/; then
                echo "Doğrulama tamam: backend ve frontend yanıt veriyor."
                exit 0
              fi
              sleep 5
            done

            echo "HATA: servisler 3 dakika içinde yanıt vermedi."
            docker compose ps
            docker compose logs --tail 60 backend frontend
            exit 1

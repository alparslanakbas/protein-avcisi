<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Güncel İndirimler | Spor Takviyesi Fiyat Takibi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Angular yüklenmeden önce temayı uygula (yanlış temanın kısa süre
    // "flaşlamasını" önlemek için) — ThemeService aynı mantığı JS tarafında
    // da uygular, bu sadece ilk boyamayı doğru yapmak için.
    (function () {
      var stored = localStorage.getItem('theme-preference');
      var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

@if (consent.status() === null) {
  <div class="noc-shell fixed inset-x-0 bottom-[56px] z-40 border-t border-[var(--noc-divider)] bg-[var(--noc-card)]/95 px-4 py-4 text-[var(--noc-text)] backdrop-blur sm:bottom-0 sm:px-6">
    <div class="mx-auto flex max-w-[1280px] flex-col items-center gap-3 sm:flex-row sm:justify-between">
      <p class="text-center text-xs text-[var(--noc-neutral-500)] sm:text-left">
        Bu site şu anda reklam veya analiz amaçlı çerez kullanmıyor — sadece tema tercihin gibi ayarlar
        tarayıcının yerel depolamasında (localStorage) tutuluyor. İleride reklam/analitik eklenirse bu
        tercihin geçerli olacak.
        <a routerLink="/cerez-politikasi" class="font-medium text-[var(--noc-accent)] hover:underline">
          Çerez Politikası
        </a>
      </p>
      <div class="flex shrink-0 items-center gap-2">
        <button
          type="button"
          (click)="consent.reject()"
          class="rounded-[8px] border border-[var(--noc-divider)] px-4 py-1.5 text-xs font-medium text-[var(--noc-neutral-500)] transition-colors hover:text-[var(--noc-text)]"
        >
          Reddet
        </button>
        <button
          type="button"
          (click)="consent.accept()"
          class="rounded-[8px] border border-[var(--noc-accent)] px-4 py-1.5 text-xs font-medium text-[var(--noc-accent)] transition-colors hover:bg-[color-mix(in_srgb,var(--noc-accent)_12%,transparent)]"
        >
          Kabul Et
        </button>
      </div>
    </div>
  </div>
}

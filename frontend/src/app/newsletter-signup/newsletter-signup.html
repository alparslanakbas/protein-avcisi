<div class="mx-auto max-w-sm text-center">
  <p class="mb-2 text-[11px] font-semibold uppercase tracking-wide text-stone-400 dark:text-stone-400">
    Öne Çıkan İndirimlerden Haberdar Ol
  </p>
  <form (ngSubmit)="onSubscribe()" class="flex gap-2">
    <input
      type="email"
      name="email"
      required
      placeholder="E-posta adresin"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      class="min-w-0 flex-1 rounded-full border border-stone-200 bg-white px-3 py-1.5 text-xs text-stone-700 placeholder:text-stone-400 focus:border-brand-400 focus:outline-none dark:border-stone-700 dark:bg-stone-900 dark:text-stone-200 dark:placeholder:text-stone-500"
    />
    <button
      type="submit"
      [disabled]="submitting()"
      class="shrink-0 rounded-full bg-brand-700 px-4 py-1.5 text-xs font-semibold text-white transition-colors hover:bg-brand-800 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Abone Ol
    </button>
  </form>
  @if (statusMessage(); as message) {
    <p
      class="mt-2 text-xs"
      [class]="statusIsError() ? 'text-red-500 dark:text-red-400' : 'text-brand-600 dark:text-brand-400'"
    >
      {{ message }}
    </p>
  }
</div>

@if (comparison.slots().length > 0) {
  <!-- Mobilde alt sekme çubuğunun (56px) ÜSTÜNDE duruyor, masaüstünde
       sayfanın en altında. Çerez bandıyla aynı konumlandırma yaklaşımı. -->
  <div class="noc-shell fixed bottom-[56px] left-0 right-0 z-40 border-t border-[var(--noc-divider)] bg-[var(--noc-card)] shadow-[var(--noc-shadow-md)] sm:bottom-0">
    <div class="mx-auto flex max-w-[1280px] items-center gap-3 px-[16px] py-3 sm:px-[28px]">
      <span class="hidden text-xs font-medium text-[var(--noc-neutral-500)] sm:block">Karşılaştır</span>

      <div class="flex min-w-0 flex-1 items-center gap-2">
        @for (slot of comparison.slots(); track slot.productId) {
          <div class="flex min-w-0 flex-1 items-center gap-2 rounded-[8px] border border-[var(--noc-divider)] px-2 py-1.5 sm:flex-none sm:basis-[240px]">
            @if (slot.imageUrl) {
              <img [src]="slot.imageUrl" [alt]="slot.productName" class="h-8 w-8 shrink-0 rounded-[4px] object-contain" loading="lazy" />
            }
            <span class="min-w-0 flex-1">
              <span class="block truncate text-xs font-medium">{{ slot.productName }}</span>
              <span class="block truncate text-[11px] text-[var(--noc-neutral-500)]">{{ slot.brandName }}</span>
            </span>
            <button
              type="button"
              class="shrink-0 text-[var(--noc-neutral-500)] hover:text-[var(--noc-accent)]"
              [attr.aria-label]="slot.productName + ' ürününü karşılaştırmadan çıkar'"
              (click)="comparison.remove(slot.productId)"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
                <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </div>
        }

        @if (!comparison.isFull()) {
          <!-- İkinci ürün seçilene kadar boş slot gösteriliyor: ne yapılması
               gerektiği (bir ürün daha seç) kendiliğinden anlaşılsın diye. -->
          <div class="flex flex-1 items-center justify-center rounded-[8px] border border-dashed border-[var(--noc-divider)] px-2 py-[13px] text-[11px] text-[var(--noc-neutral-500)] sm:flex-none sm:basis-[240px]">
            Bir ürün daha seç
          </div>
        }
      </div>

      <button
        type="button"
        class="shrink-0 rounded-[8px] px-3 py-2 text-xs font-medium transition-colors disabled:cursor-not-allowed disabled:opacity-45"
        [class]="comparison.isFull() ? 'text-[var(--noc-accent-100)]' : 'border border-[var(--noc-divider)] text-[var(--noc-neutral-500)]'"
        [style.background]="comparison.isFull() ? 'var(--noc-accent-800)' : 'transparent'"
        [disabled]="!comparison.isFull()"
        (click)="go()"
      >
        Karşılaştır
      </button>

      <button
        type="button"
        class="shrink-0 text-xs text-[var(--noc-neutral-500)] underline hover:text-[var(--noc-accent)]"
        (click)="comparison.clear()"
      >
        Temizle
      </button>
    </div>
  </div>
}
